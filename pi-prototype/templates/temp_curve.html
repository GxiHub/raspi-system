<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>加熱記錄</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: #f4f5f7;
    color: #222;
    padding: 16px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 {
    font-size: 1.3em;
    margin: 0 0 4px;
  }
  #status-line {
    font-size: 1em;
    color: #666;
    margin-bottom: 14px;
  }
  #status-line b { color: #222; }
  .state-heating { color: #e67e22; font-weight: bold; }
  .state-idle { color: #888; }

  .table-wrap {
    background: #fff;
    border-radius: 10px;
    border: 1px solid #e2e2e2;
    max-height: 70vh;
    overflow-y: auto;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.95em;
    min-width: 480px;
  }
  thead th {
    position: sticky;
    top: 0;
    background: #fafafa;
    text-align: left;
    padding: 10px 10px;
    border-bottom: 1px solid #e2e2e2;
    color: #555;
    font-weight: 600;
    white-space: nowrap;
  }
  tbody td {
    padding: 9px 10px;
    border-bottom: 1px solid #f0f0f0;
    white-space: nowrap;
  }
  tbody tr:last-child { background: #fff8ec; }
  td.ok  { color: #2e9e4c; font-weight: 600; }
  td.err { color: #e74c3c; font-weight: 700; }
  #empty-hint { padding: 20px; color: #999; text-align: center; }

  @media (max-width: 768px) {
    body { padding: 10px; }
    table { font-size: 0.88em; min-width: 420px; }
    thead th, tbody td { padding: 8px 6px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>加熱即時記錄</h1>
  <div id="status-line">狀態：<b id="cur-state">--</b>　每 15 秒記一筆</div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>時間</th>
          <th>命令功率</th>
          <th>回饋功率</th>
          <th>水溫</th>
          <th>IGBT</th>
          <th>錯誤碼</th>
        </tr>
      </thead>
      <tbody id="log-body"></tbody>
    </table>
    <div id="empty-hint">尚無資料，15 秒後顯示第一筆</div>
  </div>
</div>

<script>
const body      = document.getElementById('log-body');
const emptyHint = document.getElementById('empty-hint');
const stateEl   = document.getElementById('cur-state');
const scroller  = document.querySelector('.table-wrap');

async function pollOnce() {
  let d;
  try {
    const r = await fetch('/api/status');
    d = await r.json();
  } catch (e) {
    return;
  }

  const now = new Date();
  const t = now.toLocaleTimeString('zh-TW', { hour12: false });

  const isErr   = d.induction_error != null && d.induction_error !== 0;
  const errText = d.induction_error === 0 ? '正常'
                : d.induction_error != null ? ('E' + d.induction_error.toString(16).toUpperCase().padStart(2, '0'))
                : '--';

  const row = document.createElement('tr');
  row.innerHTML =
    '<td>' + t + '</td>' +
    '<td>' + (d.induction_pwr ?? '--') + '%</td>' +
    '<td>' + (d.induction_actual_pwr ?? '--') + '%</td>' +
    '<td>' + (d.temp != null ? d.temp.toFixed(1) : '--') + '°C</td>' +
    '<td>' + (d.induction_igbt_temp ?? '--') + '°C</td>' +
    '<td class="' + (d.induction_error === 0 ? 'ok' : isErr ? 'err' : '') + '">' + errText + '</td>';
  body.appendChild(row);
  emptyHint.style.display = 'none';
  scroller.scrollTop = scroller.scrollHeight;

  stateEl.textContent = (d.induction_pwr > 0) ? '加熱中 (' + d.induction_pwr + '%)' : '待機';
  stateEl.className = (d.induction_pwr > 0) ? 'state-heating' : 'state-idle';
}

pollOnce();
setInterval(pollOnce, 15000);
</script>
</body>
</html>
