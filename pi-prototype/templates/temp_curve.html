<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>加熱記錄</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: #f4f5f7;
    color: #222;
    padding: 16px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 {
    font-size: 1.3em;
    margin: 0 0 4px;
  }
  #status-line {
    font-size: 1em;
    color: #666;
    margin-bottom: 14px;
  }
  #status-line b { color: #222; }
  .state-heating { color: #e67e22; font-weight: bold; }
  .state-idle { color: #888; }

  .rec-btn {
    display: inline-block;
    min-height: 44px;
    padding: 0 18px;
    border: none;
    border-radius: 22px;
    font-weight: 700;
    font-size: 0.95em;
    white-space: nowrap;
    cursor: pointer;
    transition: background 0.15s;
    flex-shrink: 0;
  }
  .rec-btn.off { background: #e2e2e2; color: #555; }
  .rec-btn.on  { background: #2e9e4c; color: #fff; }
  .rec-btn:disabled { opacity: 0.6; cursor: default; }

  .control-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .query-group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 0;
    flex-wrap: wrap;
  }
  .query-label {
    color: #333;
    font-size: 0.95em;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .query-inputs {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 0;
  }
  .query-inputs input[type=date] {
    flex: 1;
    min-width: 140px;
    min-height: 44px;
    padding: 0 10px;
    border: 1px solid #d5d5d5;
    border-radius: 10px;
    font-size: 0.95em;
    background: #fff;
    color: #222;
  }
  #query-empty { padding: 20px; color: #999; text-align: center; background: #fff; border-radius: 10px; border: 1px solid #e2e2e2; }

  .table-wrap {
    background: #fff;
    border-radius: 10px;
    border: 1px solid #e2e2e2;
    max-height: 70vh;
    overflow-y: auto;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.95em;
    min-width: 480px;
  }
  thead th {
    position: sticky;
    top: 0;
    background: #fafafa;
    text-align: left;
    padding: 10px 10px;
    border-bottom: 1px solid #e2e2e2;
    color: #555;
    font-weight: 600;
    white-space: nowrap;
  }
  tbody td {
    padding: 9px 10px;
    border-bottom: 1px solid #f0f0f0;
    white-space: nowrap;
  }
  tbody tr:last-child { background: #fff8ec; }
  td.ok  { color: #2e9e4c; font-weight: 600; }
  td.err { color: #e74c3c; font-weight: 700; }
  #empty-hint { padding: 20px; color: #999; text-align: center; }
  tr.conn-fail td { color: #c0392b; background: #fdf1f0; font-style: italic; }

  @media (max-width: 768px) {
    body { padding: 10px; }
    table { font-size: 0.88em; min-width: 420px; }
    thead th, tbody td { padding: 8px 6px; }
    .query-group { flex-basis: 100%; flex-direction: column; align-items: stretch; }
    .control-row .rec-btn { flex: 1; text-align: center; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>加熱即時記錄</h1>
  <div id="status-line">狀態：<b id="cur-state">--</b>　每 15 秒記一筆</div>

  <div class="control-row">
    <div class="query-group">
      <span class="query-label">按日期查詢歷史紀錄</span>
      <div class="query-inputs">
        <input type="date" id="query-date">
        <button id="query-btn" class="rec-btn off">🔍 查詢</button>
      </div>
    </div>
    <button id="rec-toggle" class="rec-btn off">▶ 開始記錄</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>時間</th>
          <th>命令功率</th>
          <th>回饋功率</th>
          <th>水溫</th>
          <th>IGBT</th>
          <th>錯誤碼</th>
        </tr>
      </thead>
      <tbody id="log-body"></tbody>
    </table>
    <div id="empty-hint">按上面「開始記錄」後，每 15 秒顯示一筆</div>
  </div>

  <div class="table-wrap" id="query-wrap" style="display:none;">
    <table>
      <thead>
        <tr>
          <th>時間</th>
          <th>命令功率</th>
          <th>回饋功率</th>
          <th>水溫</th>
          <th>IGBT</th>
          <th>錯誤碼</th>
        </tr>
      </thead>
      <tbody id="query-body"></tbody>
    </table>
  </div>
  <div id="query-empty" style="display:none;">當天沒有紀錄</div>
</div>

<script>
const body      = document.getElementById('log-body');
const emptyHint = document.getElementById('empty-hint');
const stateEl   = document.getElementById('cur-state');
const scroller  = document.querySelector('.table-wrap');
const recToggle = document.getElementById('rec-toggle');

function formatTs(d) {
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
         ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}

async function pollOnce() {
  const now = new Date();
  const t = formatTs(now);

  let d;
  try {
    const r = await fetch('/api/status', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    d = await r.json();
  } catch (e) {
    const row = document.createElement('tr');
    row.className = 'conn-fail';
    row.innerHTML = '<td>' + t + '</td><td colspan="5">連線失敗（網路不穩，這筆沒抓到）</td>';
    body.appendChild(row);
    emptyHint.style.display = 'none';
    scroller.scrollTop = scroller.scrollHeight;
    return;
  }

  const isErr   = d.induction_error != null && d.induction_error !== 0;
  const errText = d.induction_error === 0 ? '正常'
                : d.induction_error != null ? ('E' + d.induction_error.toString(16).toUpperCase().padStart(2, '0'))
                : '--';

  const row = document.createElement('tr');
  row.innerHTML =
    '<td>' + t + '</td>' +
    '<td>' + (d.induction_pwr ?? '--') + '%</td>' +
    '<td>' + (d.induction_actual_pwr ?? '--') + '%</td>' +
    '<td>' + (d.temp != null ? d.temp.toFixed(1) : '--') + '°C</td>' +
    '<td>' + (d.induction_igbt_temp ?? '--') + '°C</td>' +
    '<td class="' + (d.induction_error === 0 ? 'ok' : isErr ? 'err' : '') + '">' + errText + '</td>';
  body.appendChild(row);
  emptyHint.style.display = 'none';
  scroller.scrollTop = scroller.scrollHeight;

  stateEl.textContent = (d.induction_pwr > 0) ? '加熱中 (' + d.induction_pwr + '%)' : '待機';
  stateEl.className = (d.induction_pwr > 0) ? 'state-heating' : 'state-idle';
}

let recording = false;
let timerId   = null;

function setRecording(on) {
  recording = on;
  if (on) {
    recToggle.textContent = '⏸ 停止記錄';
    recToggle.className = 'rec-btn on';
    pollOnce();
    timerId = setInterval(pollOnce, 15000);
  } else {
    recToggle.textContent = '▶ 開始記錄';
    recToggle.className = 'rec-btn off';
    if (timerId) clearInterval(timerId);
    timerId = null;
  }
}

recToggle.addEventListener('click', () => setRecording(!recording));

// ── 按日期查詢歷史紀錄 ─────────────────────────────────────────────
const queryDate  = document.getElementById('query-date');
const queryBtn   = document.getElementById('query-btn');
const queryBody  = document.getElementById('query-body');
const queryWrap  = document.getElementById('query-wrap');
const queryEmpty = document.getElementById('query-empty');

function formatDateOnly(d) {
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
queryDate.value = formatDateOnly(new Date());

function renderQueryRow(r) {
  const t = formatTs(new Date(r.ts * 1000));
  const isErr   = r.error != null && r.error !== 0;
  const errText = r.error === 0 ? '正常'
                : r.error != null ? ('E' + r.error.toString(16).toUpperCase().padStart(2, '0'))
                : '--';
  const row = document.createElement('tr');
  row.innerHTML =
    '<td>' + t + '</td>' +
    '<td>' + (r.cmd_pwr ?? '--') + '%</td>' +
    '<td>' + (r.actual_pwr ?? '--') + '%</td>' +
    '<td>' + (r.pt100 != null ? r.pt100.toFixed(1) : '--') + '°C</td>' +
    '<td>' + (r.igbt ?? '--') + '°C</td>' +
    '<td class="' + (r.error === 0 ? 'ok' : isErr ? 'err' : '') + '">' + errText + '</td>';
  return row;
}

queryBtn.addEventListener('click', async () => {
  const date = queryDate.value;
  if (!date) return;
  queryBtn.disabled = true;
  queryBtn.textContent = '查詢中...';
  try {
    const r = await fetch('/api/log_by_day?date=' + encodeURIComponent(date), { cache: 'no-store' });
    const d = await r.json();
    queryBody.innerHTML = '';
    if (!d.readings || d.readings.length === 0) {
      queryWrap.style.display  = 'none';
      queryEmpty.style.display = 'block';
    } else {
      d.readings.forEach(reading => queryBody.appendChild(renderQueryRow(reading)));
      queryEmpty.style.display = 'none';
      queryWrap.style.display  = 'block';
    }
  } catch (e) {
    queryBody.innerHTML = '';
    queryWrap.style.display  = 'none';
    queryEmpty.textContent   = '查詢失敗，網路不穩，請重試';
    queryEmpty.style.display = 'block';
  } finally {
    queryBtn.disabled = false;
    queryBtn.textContent = '🔍 查詢';
  }
});
</script>
</body>
</html>
